[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/items"
  to = "/.netlify/functions/items"
  status = 200

[[redirects]]
  from = "/api/spark"
  to = "/.netlify/functions/spark"
  status = 200

[[redirects]]
  from = "/api/brief"
  to = "/.netlify/functions/brief"
  status = 200

[[redirects]]
  from = "/api/sweep"
  to = "/.netlify/functions/sweep"
  status = 200

[[redirects]]
  from = "/api/shape"
  to = "/.netlify/functions/shape"
  status = 200

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
